platform: Common
buildPlatform: Flutter
displayName: Flutter Install
description: "Installs the selected Flutter SDK version from the official Flutter release archives. Defaults to: stable. Set FLUTTER_STORAGE_BASE_URL to install from an internal mirror."
inputs:
- key: "AC_SELECTED_FLUTTER_VERSION"
  isRequired: false
  title: Selected Flutter Version
  description: "Flutter version or channel (stable, beta). Branches and commits require GitHub access. Defaults to: stable. The version you set on config section will override this setting."
  helpText:
outputs:
- key: "PATH"
  defaultValue: "PATH"
  title: PATH Variable
  description: PATH variable that add Flutter tool for your workflow.
  helpText:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"
